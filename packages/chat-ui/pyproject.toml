[project]
name = "chat-ui"
version = "0.1.0"
description = "The transcript of a chat page: markdown, work folded into one line, marks, following the stream."
requires-python = ">=3.12"
# Deliberately dependency-free: it is static files and the path to them.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_ui"]
