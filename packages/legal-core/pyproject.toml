[project]
name = "legal-core"
version = "0.1.0"
description = "Dependency-free legal citation parsing, resolution and decision-text parsing."
requires-python = ">=3.13"
# Deliberately dependency-free: both the web app and the ingest job import it,
# and the app's cold start pays for everything this pulls in.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_core"]
