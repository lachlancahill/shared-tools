[project]
name = "chatgpt-plan"
version = "0.1.0"
description = "Spend a ChatGPT plan on OpenAI Responses calls first, and an API key when the plan cannot."
requires-python = ">=3.12"
dependencies = [
    "google-cloud-firestore>=2.16",
    "httpx>=0.27",
    "openai>=1.99",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_plan"]
