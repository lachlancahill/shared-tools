[project]
name = "legal-corpus"
version = "0.1.0"
description = "Read-only search, graph traversal and citation checking over published legal snapshots."
requires-python = ">=3.13"
dependencies = [
    "legal-core",
    "duckdb>=1.3.0",
    "lancedb>=0.25",
    "pyarrow>=20.0.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_corpus"]
